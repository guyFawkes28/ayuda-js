<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
    <title>Detail top</title>
</head>
<body>
    <!-- Detail top -->
    <main >
        <div class="d-flex justify-content-center align-items-center row w-100" style="min-height: 100vh;">
            <div class="col-md-10">
                <button type="button" class="btn btn-secondary btn-sm"> volver al listado</button>
                <div class="card mt-3">
                    <div class="d-flex gap-5 pt-5 px-5 align-items-start justify-content-between">
                        <div>
                            <h1>
                                Ciudad de México
                            </h1>
                            <p>
                                <small class="text-body-secondary">Lat: 19.4326 / Lon: -99.1332</small>
                            </p>
                        </div>
                        <div class="d-flex justify-content-end">
                            <button class="btn btn-primary btn-sm rounded-pill py-2 px-3" type="button">Activo</button>
                        </div>
                    </div>
                    <div class="card-body">
                        <figure>
                        <blockquote class="blockquote">
                            <p>Monitoreo climático y ambiental en la zona metropolitana para prevención de contingencias ambientales y apoyo en la toma de decisiones para planeación urbana.</p>
                        </blockquote>
                        </figure>
                    </div>
                </div>
                <!-- Contenedor condiciones actuales -->
                <div class="d-flex gap-4 mt-4">
                    <div class="card p-5">
                        <div class="d-flex row gap-5">
                                <div class="d-flex flex-column gap-4">
                                    <h4>Condiciones Actuales</h4>
                                    <div class="d-flex justify-content-between align-items-center">
                                            <div class="mb-0">
                                                <h1>22 °</h1>
                                                <small class="text-body-secondary">Sensación térmica: 20°C</small>                                            
                                            </div>
                                            <svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" fill="currentColor" class="bi bi-bar-chart" viewBox="0 0 16 16"><path d="M4 11H2v3h2zm5-4H7v7h2zm5-5v12h-2V2zm-2-1a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1zM6 7a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1zm-5 4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1z"/></svg>
                                    </div>
                                </div>
                                <!-- cards metrics -->
                                <div class="container">
                                    <div class="row row-cols-4">
                                        <div class="col">
                                            <div class="card">
                                            <div class="card-body row">
                                                <svg class="metric-icon blue" fill="none" stroke="currentColor" viewBox="" width="25" height="30"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>                                                
                                                <small class="text-body-secondary">Viento</small>                                            
                                                <p class="card-text">15 km/h</p>
                                            </div>
                                            </div>
                                        </div>
                                        <div class="col">
                                            <div class="card">
                                            <div class="card-body row">
                                                <svg class="metric-icon sky" fill="none" stroke="currentColor" viewBox="" width="2" height="30"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"></path></svg>
                                                <small class="text-body-secondary">Precipitación</small>                                            
                                                <p class="card-text">0 mm</p>
                                            </div>
                                            </div>
                                        </div>
                                        <div class="col">
                                            <div class="card">
                                            <div class="card-body row">
                                                <svg class="metric-icon teal" fill="none" stroke="currentColor" viewBox="" width="2" height="30"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                                                <small class="text-body-secondary">Humedad</small>                                            
                                                <p class="card-text">0 mm</p>
                                            </div>
                                            </div>
                                        </div>
                                        <div class="col">
                                            <div class="card">
                                            <div class="card-body row">
                                                <svg class="metric-icon purple" fill="none" stroke="currentColor" viewBox="" width="2" height="30"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                                                <small class="text-body-secondary">Visibilidad</small>                                            
                                                <p class="card-text">10 km</p>
                                            </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                        </div>
                    </div>
                    <div>
                        <div class="card p-4">
                            <h4>Sol</h4>
                            <div class="row row-cols-4 pt-3">
                                <div class="col-1">
                                    <svg class="sun-icon sunrise" fill="none" stroke="currentColor" height="30"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M9 19l3 3m0 0l3-3m-3 3V10"></path></svg>
                                </div>
                                <p class="col-8">Amanecer</p>
                                <p class="col">06:45</p>
                            </div>
                            <div class="row row-cols-4">
                                <div class="col-1">
                                    <svg class="sun-icon sunset" fill="none" stroke="currentColor" height="30"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                                </div>
                                <p class="col-8">Atardecer</p>
                                <p class="col">19:30</p>
                            </div>
                        </div>
                        <div class="card mt-4 p-4">
                            <div class="row ">
                                <div>
                                    <svg class="update-icon" fill="none" stroke="currentColor" width="50" height="50"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                    <small class="text-body-secondary col-1">Última actualización</small>
                                </div>
                                <h6>1 de enero, 2026 - 13:45</h6>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </main>
</body>
</html>
